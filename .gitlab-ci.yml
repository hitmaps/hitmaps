# Pipeline for the combined repository.
# Security jobs are the ones previously at the root of hitmaps/hitmaps.
# The image job is the one previously in hitmaps/hitmaps-backend, with the
# build context moved to backend/. GitLab only runs the root .gitlab-ci.yml,
# so frontend/.gitlab-ci.yml and backend/.gitlab-ci.yml are not used.

stages:
  - test
  - release

include:
  - template: Security/SAST.gitlab-ci.yml
  - template: Jobs/Dependency-Scanning.v2.gitlab-ci.yml

sast:
  stage: test

docker-build:
  image: docker:28.5.2
  stage: release
  environment: $CI_COMMIT_BRANCH
  only:
    - master
  services:
    - docker:dind
  before_script:
    - export DOCKER_REGISTRY_USER=$CI_REGISTRY_USER
    - export DOCKER_REGISTRY_PASSWORD=$CI_REGISTRY_PASSWORD
    - export DOCKER_REGISTRY_URL=$CI_REGISTRY
    - export COMMIT_HASH=$CI_COMMIT_SHA
    - export IMAGE_NAME_WITH_REGISTRY_PREFIX=$CI_REGISTRY_IMAGE
    - docker login -u "$DOCKER_REGISTRY_USER" -p "$DOCKER_REGISTRY_PASSWORD" $DOCKER_REGISTRY_URL
    - apk add --no-cache curl
  script:
    - echo "Building..."
    - export CONTAINER_FULL_IMAGE_NAME=$IMAGE_NAME_WITH_REGISTRY_PREFIX/api
    - export CONTAINER_FULL_IMAGE_NAME_WITH_TAG=$CONTAINER_FULL_IMAGE_NAME:$COMMIT_HASH
    - docker build -f ./backend/API/Dockerfile --pull -t built-image-name ./backend
    - docker tag built-image-name "$CONTAINER_FULL_IMAGE_NAME_WITH_TAG"
    - docker tag built-image-name "$CONTAINER_FULL_IMAGE_NAME:$CI_COMMIT_BRANCH"
    - docker push "$CONTAINER_FULL_IMAGE_NAME_WITH_TAG"
    - echo $CONTAINER_FULL_IMAGE_NAME_WITH_TAG
    - docker push "$CONTAINER_FULL_IMAGE_NAME:$CI_COMMIT_BRANCH"
    - echo $CONTAINER_FULL_IMAGE_NAME:$CI_COMMIT_BRANCH
    - echo "Deploying on Dokploy..."
    - 'curl -X POST "$DOKPLOY_URL/api/application.deploy" -H "accept: application/json" -H "x-api-key: $DOKPLOY_TOKEN" -H "Content-Type: application/json" -d "{\"applicationId\": \"$DOKPLOY_APPLICATION_ID\"}"'
